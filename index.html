<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Access Control</title>
  <style>
    :root {
      --primary: #F1B428;
      --bg: #0d0f12;
      --card-bg: #161a22;
      --border: #2a313d;
      --text: #ffffff;
      --text-muted: #8b949e;
      --success: #2ea043;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Connection Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      transition: background 0.3s ease;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    /* Buttons */
    button {
      cursor: pointer;
      border: none;
      outline: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-connect {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-connect:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Input & Form */
    .input-wrapper {
      position: relative;
      margin: 15px 0 12px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: #090c10;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 44px 14px 16px;
      font-size: 1.1rem;
      color: var(--text);
      letter-spacing: 1.5px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .toggle-visibility {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: #000;
      padding: 14px;
      font-size: 1rem;
      margin-top: 6px;
    }

    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
    }

    .alert-banner.granted {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .alert-banner.denied {
      display: block;
      background: rgba(248, 81, 73, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Terminal Console */
    .terminal-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .terminal {
      background: #090c10;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 140px;
      padding: 12px;
      overflow-y: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    .log-entry {
      color: var(--text-muted);
    }

    .log-entry.in {
      color: var(--primary);
    }

    .log-entry.out {
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header & Connection Card -->
    <div class="card header-bar">
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <button id="connectBtn" class="btn-connect">Connect Board</button>
    </div>

    <!-- Security Keypad Card -->
    <div class="card">
      <h2 style="font-size: 1.15rem; font-weight: 600;">Access Authentication</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">
        Enter credentials to authorize hardware trigger.
      </p>

      <form id="authForm">
        <div class="input-wrapper">
          <input type="password" id="passwordInput" placeholder="Enter system key..." autocomplete="off">
          <button type="button" id="togglePass" class="toggle-visibility">SHOW</button>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit" disabled>Transmit Key</button>
      </form>

      <div id="alertBanner" class="alert-banner"></div>
    </div>

    <!-- Live Serial Stream Console -->
    <div class="card">
      <div class="terminal-title">Serial Stream (9600 Baud)</div>
      <div id="terminal" class="terminal"></div>
    </div>
  </div>

  <script>

    }

        await disconnectSerial();
      } else {
        await connectSerial();
      }
    });
